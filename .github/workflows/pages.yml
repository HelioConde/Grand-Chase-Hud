name: Grand Chase HUD — publicar GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar scripts e arquivos essenciais
        run: |
          node --check game.js
          node --check js/selection.js
          test -f index.html
          test -f iniciar.html
          test -f game.html
          test -f models/elesis/ele.obj || test -d models/elesis
  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Montar somente a experiência estática
        run: |
          mkdir -p _site
          cp index.html iniciar.html game.html style.css iniciar.css game.css game.js GC_logo.png bg.png Ryan.mp4 Elesis.mp4 _site/
          cp -R img js models _site/
          touch _site/.nojekyll
          test -f _site/game.html
          test -f _site/js/three.min.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
